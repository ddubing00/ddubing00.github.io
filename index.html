<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>낙인의 정원 - 카리스 아레나</title>
  <style>
    /* 웹 폰트 불러오기냥 */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    @import url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff');

    /* 1. 스무스 스크롤 및 기본 설정 (최신 웹 기술 적용!) */
    html {
      scroll-behavior: smooth; 
    }
    body {
      background-color: #0b0b0b; 
      color: #e0e0e0;
      font-family: 'Pretendard', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* 2. 줌인 & 페이드아웃 터미널 인트로 화면 */
    #login-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100vh;
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1); /* 슈유육~ 빨려 들어가는 애니메이션냥! */
    }
    .login-box {
      border: 1px solid #d9534f;
      padding: 50px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 0 20px rgba(217, 83, 79, 0.3);
      background-color: #121212;
    }
    .login-title {
      font-family: 'RIDIBatang', serif;
      color: #d9534f;
      font-size: 2.5rem;
      margin: 0 0 10px 0;
      letter-spacing: 5px;
    }
    .login-btn {
      background-color: transparent;
      color: #d9534f;
      border: 1px solid #d9534f;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
    }
    .login-btn:hover {
      background-color: #d9534f;
      color: #000;
    }
    .fade-out-zoom {
      opacity: 0;
      transform: scale(1.5);
      pointer-events: none;
    }

    /* 3. 상단 고정 네비게이션 (스크롤 따라다님냥!) */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 15px 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(11, 11, 11, 0.8);
      backdrop-filter: blur(10px); /* 헤더에도 반투명 유리 효과냥! */
      border-bottom: 1px solid rgba(217, 83, 79, 0.3);
      z-index: 1000;
      box-sizing: border-box;
    }
    .nav-links {
      display: flex;
      gap: 30px;
    }
    .nav-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 1rem;
      transition: 0.3s;
      font-family: 'RIDIBatang', serif;
    }
    .nav-links a:hover {
      color: #d9534f;
    }

    /* 공통 섹션 여백 */
    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px 20px 20px 20px;
    }

    /* 4. 와이드 지도 섹션 */
    .map-container {
      position: relative;
      width: 95%;
      max-width: 1400px;
      aspect-ratio: 16 / 9; 
      background-image: url(https://github.com/ddubing00/ddubing00.github.io/blob/main/%EB%B9%88%20%EC%A7%80%EB%8F%84.jpg?raw=true); /* 네가 저장한 영어 이름 사진 주소냥! */
      background-size: cover;
      background-position: center;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
    }
    .map-title {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #d9534f;
      font-size: 2.5rem;
      letter-spacing: 4px;
      text-shadow: 2px 2px 5px #000;
      font-family: 'RIDIBatang', serif;
    }

    /* 5. 글래스모피즘(반투명 유리) 콘텐츠 박스 */
    .glass-container {
      display: flex;
      gap: 30px;
      max-width: 1200px;
      width: 100%;
      margin-top: 40px;
    }
    .glass-box {
      flex: 1;
      /* 피 튀기는 전장 위에 어울리는 서늘한 붉은빛 반투명 유리 효과냥! */
      background: rgba(30, 15, 15, 0.4); 
      backdrop-filter: blur(12px); 
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(217, 83, 79, 0.2);
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }
    .glass-box h3 {
      font-family: 'RIDIBatang', serif;
      color: #d9534f;
      border-bottom: 1px solid #d9534f;
      padding-bottom: 10px;
      margin-top: 0;
    }
  </style>
</head>
<body>

  <!-- [기술 1] 줌인 인트로 화면 -->
  <div id="login-screen">
    <div class="login-box">
      <h2 class="login-title">KARIS ARENA</h2>
      <p style="color: #888; letter-spacing: 2px;">[ 터미널 보안 인증 시스템 ]</p>
      <button class="login-btn" onclick="enterArena()">접속 허가</button>
    </div>
  </div>

  <!-- [기술 2] 스크롤 고정 네비게이션 -->
  <header>
    <div class="nav-links">
      <a href="#section-map">전장 지도</a>
      <a href="#section-rules">아레나 규정</a>
      <a href="#section-targets">타겟 & 동맹</a>
    </div>
  </header>

  <!-- 지도 섹션 -->
  <section id="section-map">
    <div class="map-container">
      <h1 class="map-title">카리스 아레나 : 낙인의 정원</h1>
    </div>
  </section>

  <!-- [기술 3] 글래스모피즘 반투명 정보 창 -->
  <section id="section-rules">
    <h2 style="font-family: 'RIDIBatang', serif; font-size: 2.5rem; color: #fff;">생존 규정 및 기밀 문서</h2>
    <div class="glass-container">
      <div class="glass-box">
        <h3>제1항 : 승리 조건</h3>
        <p>1주일간의 생존 경쟁 후, 몸에 찍힌 '인장'의 개수가 가장 적은 자가 1위를 차지하여 수도로 승격한다.</p>
      </div>
      <div class="glass-box">
        <h3>제2항 : 무력화 인장 각인</h3>
        <p>상대가 저항할 수 없는 무력화 상태(기절, 수면, 절정 등)에서 10초를 유지해야 인장을 새길 수 있다.</p>
      </div>
    </div>
  </section>

  <!-- 다음 섹션 준비 공간 -->
  <section id="section-targets">
    <h2 style="font-family: 'RIDIBatang', serif; font-size: 2.5rem; color: #fff;">참가자 명부</h2>
    <div class="glass-container">
      <div class="glass-box" style="text-align: center;">
        <p style="color: #888;">데이터 접근 중...</p>
      </div>
    </div>
  </section>

  <!-- 인트로 애니메이션 자바스크립트 -->
  <script>
    function enterArena() {
      const loginScreen = document.getElementById('login-screen');
      loginScreen.classList.add('fade-out-zoom');
      setTimeout(() => {
        loginScreen.style.display = 'none';
      }, 1200);
    }
  </script>
</body>
</html>
