<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>낙인의 정원 - 카리스 아레나 공식 사이트</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      background-color: #1e1e1e;
      width: 100%;
      padding: 20px 0;
      text-align: center;
      border-bottom: 2px solid #d9534f;
      margin-bottom: 20px;
    }
    h1 {
      color: #d9534f;
      margin: 0;
      font-size: 2rem;
      letter-spacing: 3px;
    }
    .map-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9; /* 이미지 비율에 맞춰 조정 */
      background-image: url(https://github.com/ddubing00/ddubing00.github.io/blob/main/%EB%B9%88%20%EC%A7%80%EB%8F%84.jpg?raw=true); /* <--- 중요! */
      background-size: cover;
      background-position: center;
      border: 1px solid #444;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      margin-bottom: 20px;
    }
   .area-link {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      /* 투박한 배경과 테두리를 없앴다냥! */
      background-color: transparent; 
      border: none;
      
      /* 폰트를 판타지스러운 명조체로 바꾸고 크기를 키웠다냥 */
      font-family: 'Batang', 'Nanum Myeongjo', serif;
      font-size: 1.3rem;
      font-weight: bold;
      color: #e0e0e0;
      text-decoration: none;
      
      /* 글씨 주변에 안개처럼 은은하게 빛나는 효과를 줬다냥 */
      text-shadow: 0 0 5px #000, 0 0 15px #88aaff, 0 0 20px #88aaff; 
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    .area-link:hover {
      /* 마우스를 올리면 황금빛으로 강렬하게 타오르듯 빛난다냥! */
      color: #ffffff;
      text-shadow: 0 0 10px #000, 0 0 20px #f0ad4e, 0 0 30px #d9534f;
      transform: scale(1.15);
    }
    
    /* 각 구역의 위치 좌표 설정 (가로%, 세로% 기준) */
    /* 지도를 보며 이 위치를 미세 조정해야 한다냥 */
    #link-mirror-lake { top: 48%; left: 45%; }
    #link-forest { top: 62%; left: 75%; }
    #link-field { top: 22%; left: 37%; }
    #link-ruins { top: 42%; left: 16%; }
    #link-mist { top: 12%; left: 88%; }
    
    /* 하단 사이트 메뉴 */
    .site-menu {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .menu-button {
      background-color: #1e1e1e;
      border: 2px solid #444;
      color: #e0e0e0;
      padding: 15px 30px;
      font-size: 1.1rem;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }
    .menu-button:hover {
      border-color: #f0ad4e;
      color: #f0ad4e;
    }
  </style>
</head>
<body>
  <header>
    <h1>카리스 아레나 : 낙인의 정원</h1>
  </header>

  <!-- 지도 이미지 및 클릭 가능한 구역 -->
  <div class="map-container">
    <!-- 예시: 거울 호수를 클릭하면 호수 설명 창으로 (아직 안 만듦) -->
    <a href="#" class="area-link" id="link-mirror-lake">1. 거울 호수</a>
    <a href="#" class="area-link" id="link-forest">2. 울창한 숲</a>
    <a href="#" class="area-link" id="link-field">3. 열린 공터</a>
    <a href="#" class="area-link" id="link-ruins">4. 작은 폐허</a>
    <a href="#" class="area-link" id="link-mist">5. 경계의 안개</a>
  </div>

  <!-- 주요 사이트 메뉴 -->
  <div class="site-menu">
    <a href="#" class="menu-button">👤 캐릭터 소개</a>
    <!-- 이 '규칙 소개'를 누르면 우리가 아까 만든 룰북 페이지로 이동하게 할 거다냥! -->
    <a href="#" class="menu-button">📜 규칙 소개</a>
    <a href="#" class="menu-button">⚔️ 서바이벌 가이드</a>
  </div>
</body>
</html>
