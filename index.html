<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>낙인의 정원 - 카리스 아레나</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    @import url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff');

    html {
      scroll-behavior: smooth; 
    }
/* 1. 전체 배경 (너무 어둡지 않게 60% 필터로 줄였다냥!) */
    body {
      background-color: #0b0b0b; 
      color: #e0e0e0;
      font-family: 'Pretendard', sans-serif;
      margin: 0;
      padding: 0;
      background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('map.jpg'); 
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow: hidden; 
    }

    /* 2. 인트로 접속 창 (겹치는 까만 배경을 투명하게 치워버렸다냥!) */
    #login-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100vh;
      background-color: transparent; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }
    
    /* 3. 부제목 (현대적이고 깔끔한 폰트로 변경하고 여백을 줬다냥) */
    .intro-subtitle {
      font-family: 'Pretendard', sans-serif;
      color: #ccc;
      letter-spacing: 5px;
      margin-bottom: 25px;
      font-size: 1.1rem;
    }
    
    /* 4. 메인 타이틀 (흰색 글씨에 붉은 안개가 퍼지듯 고급스럽게 바꿨다냥!) */
    .intro-title {
      font-family: 'RIDIBatang', serif;
      color: #ffffff;
      font-size: 5rem; 
      margin: 0;
      letter-spacing: 8px;
      text-shadow: 0 0 30px rgba(217, 83, 79, 0.9), 2px 2px 10px rgba(0,0,0,0.8);
    }
    
    /* 5. 접속 버튼 (세련된 테두리 버튼으로 디자인했다냥) */
    .login-btn {
      position: absolute; 
      bottom: 12%;
      background-color: transparent;
      color: #eee;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 15px 50px;
      font-size: 1.1rem;
      letter-spacing: 3px;
      cursor: pointer;
      transition: 0.4s;
    }
    .login-btn:hover {
      background-color: rgba(217, 83, 79, 0.2);
      border-color: #d9534f;
      color: #d9534f;
      box-shadow: 0 0 20px rgba(217, 83, 79, 0.5);
    }
    .fade-out-zoom {
      opacity: 0;
      transform: scale(1.5);
      pointer-events: none;
    }

    /* 🌟 3. 메인 콘텐츠들을 하나로 묶어서 처음엔 투명 망토를 씌워둔다냥! */
    #main-wrapper {
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.5s ease; /* 나중에 1.5초 동안 스르륵 나타날 거다냥 */
    }

    /* 상단 고정 네비게이션 */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 15px 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(11, 11, 11, 0.8);
      backdrop-filter: blur(10px); 
      border-bottom: 1px solid rgba(217, 83, 79, 0.3);
      z-index: 1000;
      box-sizing: border-box;
    }
    .nav-links {
      display: flex;
      gap: 30px;
    }
    .nav-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 1rem;
      transition: 0.3s;
      font-family: 'RIDIBatang', serif;
    }
    .nav-links a:hover {
      color: #d9534f;
    }

    /* 공통 섹션 */
    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px 20px 20px 20px;
    }

    /* 와이드 지도 섹션 */
    .map-container {
      position: relative;
      width: 95%;
      max-width: 1400px;
      aspect-ratio: 16 / 9; 
      background-image: url('map.jpg'); /* 지도 사진 주소 유지냥! */
      background-size: cover;
      background-position: center;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
    }
    .map-title {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #d9534f;
      font-size: 2.5rem;
      letter-spacing: 4px;
      text-shadow: 2px 2px 5px #000;
      font-family: 'RIDIBatang', serif;
    }

    /* 글래스모피즘(반투명 유리) 콘텐츠 박스 */
    .glass-container {
      display: flex;
      gap: 30px;
      max-width: 1200px;
      width: 100%;
      margin-top: 40px;
    }
    .glass-box {
      flex: 1;
      background: rgba(30, 15, 15, 0.4); 
      backdrop-filter: blur(12px); 
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(217, 83, 79, 0.2);
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }
    .glass-box h3 {
      font-family: 'RIDIBatang', serif;
      color: #d9534f;
      border-bottom: 1px solid #d9534f;
      padding-bottom: 10px;
      margin-top: 0;
    }
  </style>
</head>
<body>

  <!-- 1. 가장 먼저 보이는 인트로 화면 -->
 <!-- 1. 가장 먼저 보이는 웅장한 인트로 화면 -->
  <div id="login-screen">
    <p class="intro-subtitle">살아남아라. 그리고 찍어라.</p>
    <h1 class="intro-title">아레나 '낙인의정원'</h1>
    <button class="login-btn" onclick="enterArena()">접속 허가</button>
  </div>

  <!-- 🌟 2. 메인 콘텐츠들을 이 div(#main-wrapper) 안에 가둬서 한 번에 통제한다냥! -->
  <div id="main-wrapper">
    
<header>
      <div class="nav-links">
        <!-- 규정 -> 타겟 -> 지도 순서로 재배치했다냥! -->
        <a href="#section-rules">아레나 규정</a>
        <a href="#section-targets">타겟 & 동맹</a>
        <a href="#section-map">전장 지도</a>
      </div>
    </header>

   <!-- 1. 아레나 규정 섹션 (가장 먼저 나오게 위로 올렸다냥!) -->
    <section id="section-rules">
      <h2 style="font-family: 'RIDIBatang', serif; font-size: 2.5rem; color: #fff;">생존 규정 및 기밀 문서</h2>
      <div class="glass-container">
        <div class="glass-box">
          <h3>제1항 : 승리 조건</h3>
          <p>1주일간의 생존 경쟁 후, 몸에 찍힌 '인장'의 개수가 가장 적은 자가 1위를 차지하여 수도로 승격한다.</p>
        </div>
        <div class="glass-box">
          <h3>제2항 : 무력화 인장 각인</h3>
          <p>상대가 저항할 수 없는 무력화 상태(기절, 수면, 절정 등)에서 10초를 유지해야 인장을 새길 수 있다.</p>
        </div>
      </div>
    </section>

    <!-- 2. 타겟 & 동맹 섹션 -->
    <section id="section-targets">
      <h2 style="font-family: 'RIDIBatang', serif; font-size: 2.5rem; color: #fff;">참가자 명부</h2>
      <div class="glass-container">
        <div class="glass-box" style="text-align: center;">
          <p style="color: #888;">데이터 접근 중...</p>
        </div>
      </div>
    </section>

    <!-- 3. 전장 지도 섹션 (가장 아래로 내렸다냥!) -->
    <section id="section-map">
      <div class="map-container">
        <h1 class="map-title">카리스 아레나 : 낙인의 정원</h1>
      </div>
    </section>
  </div>

  <script>
    function enterArena() {
      const loginScreen = document.getElementById('login-screen');
      const mainWrapper = document.getElementById('main-wrapper');
      
      // 1. 로그인 창 줌인 되면서 사라지는 효과냥
      loginScreen.classList.add('fade-out-zoom');
      
      // 2. 숨겨뒀던 메인 창(#main-wrapper)을 보이게 만들고 스크롤 잠금도 푼다냥!
      mainWrapper.style.visibility = 'visible';
      mainWrapper.style.opacity = '1';
      document.body.style.overflow = 'auto'; // 스크롤바 다시 등장!
      
      // 3. 1.2초 뒤에 로그인 창은 완전히 화면에서 치워버린다냥
      setTimeout(() => {
        loginScreen.style.display = 'none';
      }, 1200);
    }
  </script>
</body>
</html>
